<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Echo · 开口说一句</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./fonts/fonts.css"><link rel="stylesheet" href="./styles.css?v=5.7"><script type="module" src="./bootstrap.js?v=5.8"></script></head>
<body>
  <div class="portrait"><span class="portrait-icon" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="15" y="8" width="22" height="32" rx="3"/><path d="M9 21c-3 7 1 16 8 19M7 22l3-7 6 4"/></svg></span><strong>请把平板转过来</strong><span>横过来，看得更清楚。</span></div>
  <div class="app">
    <div id="offline-banner" class="offline-banner" hidden>网断了，练习会留在这台设备上。</div>
    <header class="top"><div class="top-start"><span class="brand"><img src="./assets/mascot/echo-mascot-parrot-macaw-A.png" width="40" height="40" alt="">Echo <span>开口说一句</span></span><button id="back" class="top-icon" hidden>返回</button><button id="stage-back" class="top-icon" hidden>上一环节</button></div><div class="top-end"><span id="unit-chip" class="unit-chip"></span><span id="stage-label" class="quiet"></span><span id="streak-chip" class="streak-chip"></span><span id="demo-badge" class="demo-badge" hidden>演示</span><button id="parent-open" class="top-icon" aria-label="家长查看"></button><button id="settings-open" class="top-icon">设置</button></div></header>
    <main id="main" aria-live="polite"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="help" class="help-modal" aria-labelledby="help-title"><div class="help"><div class="help-head"><h2 id="help-title">需要家长协助</h2><button id="close-help" class="secondary">关闭</button></div><ol class="help-steps"><li><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="3" y="6" width="34" height="28" rx="5"/><path d="M3 13h34M20 18v9M16 23a4 4 0 0 0 8 0"/></svg><span>点浏览器地址旁的麦克风图标，选择正在用的麦克风。</span></li><li><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="7" width="30" height="26" rx="5"/><path d="m12 21 5 5 11-12"/></svg><span>浏览器询问时点“允许”。没有可选设备时，到电脑设置中打开麦克风。</span></li><li><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 20h24m-8-8 8 8-8 8M8 8v24"/></svg><span>回到此页，再点“开始录音”。</span></li></ol><button id="copy-help" class="secondary">复制求助句</button><p id="copy-status"></p></div></dialog>
  <dialog id="settings" class="help-modal" aria-labelledby="settings-title"><div class="help"><div class="help-head"><h2 id="settings-title">设置</h2><button id="settings-close" class="secondary">关闭</button></div><p>录音保存在这台设备上。</p><button id="selfcheck-open" class="secondary">演示前自检</button><button id="delete-recordings" class="secondary danger-ghost">删除我的录音</button><div id="delete-confirm" hidden><p>将删除这台设备保存的全部录音。删除后不能恢复。</p><div class="actions"><button id="delete-cancel" class="secondary">先保留</button><button id="delete-all" class="primary danger">确认删除</button></div></div><button id="demo-reset" class="secondary" hidden>重置演示记录</button><div id="demo-reset-confirm" hidden><p>只清除这个演示空间的录音、进度和家长口令，删除后不能恢复。日常记录会保留。</p><div class="actions"><button id="demo-reset-cancel" class="secondary">先保留</button><button id="demo-reset-all" class="primary danger">确认重置演示记录</button></div></div><p id="delete-status" aria-live="polite"></p></div></dialog>
  <dialog id="rest" class="help-modal" aria-labelledby="rest-title"><div class="help"><h2 id="rest-title">已经读了 30 分钟了。</h2><p>休息一会儿，看看远处。</p><div class="actions"><button id="rest-now" class="primary">好，休息一下</button><button id="rest-continue-dialog" class="secondary">可以继续学习</button></div></div></dialog>
</body>
</html>
